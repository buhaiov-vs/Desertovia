services:
  postgres:
    image: postgres:17
    container_name: desertod-postgres
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: desertod
      POSTGRES_PASSWORD: desertod
      POSTGRES_DB: desertod
    ports:
      - "5432:5432"
    volumes:
      - desertod-postgres-data:/var/lib/postgresql/data

volumes:
  desertod-postgres-data:
